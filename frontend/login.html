<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — BioMed</title>
  <link rel="stylesheet" href="/static/css/biomed-identity.css?v=rc20p1" />
  <link rel="stylesheet" href="/static/css/biomed-login.css?v=rc20p1" />
</head>
<body class="bm-login-body">
  <div class="bm-login-shell">
    <a class="bm-login-back" href="/landing">← BioMed</a>
    <div class="bm-login-card">
      <header class="bm-login-header">
        <p class="bm-login-brand">BioMed</p>
        <h1>Entrar na plataforma</h1>
        <p class="bm-login-sub">Inteligência em Saúde Corporativa</p>
      </header>

      <div id="alert" class="bm-login-alert" role="alert" hidden></div>

      <form id="loginForm" class="bm-login-form">
        <label class="bm-login-field">
          <span>Usuário</span>
          <input type="text" id="username" name="username" placeholder="Seu usuário" required autocomplete="username" />
        </label>
        <label class="bm-login-field">
          <span>Senha</span>
          <div class="bm-login-pass">
            <input type="password" id="password" name="password" placeholder="Sua senha" required autocomplete="current-password" />
            <button type="button" class="bm-login-toggle" id="togglePassword" aria-label="Mostrar senha">Mostrar</button>
          </div>
        </label>
        <button type="submit" class="bm-login-submit" id="loginBtn">
          <span class="bm-login-loading" id="loading" hidden>…</span>
          <span id="loginText">Entrar</span>
        </button>
      </form>

      <p class="bm-login-foot"><a href="/landing">Voltar à página inicial</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const alertDiv = document.getElementById("alert");
    const loginBtn = document.getElementById("loginBtn");
    const loading = document.getElementById("loading");
    const loginText = document.getElementById("loginText");

    function showAlert(message, type) {
      alertDiv.hidden = false;
      alertDiv.textContent = message;
      alertDiv.className = "bm-login-alert is-" + (type || "error");
      setTimeout(function () {
        alertDiv.hidden = true;
      }, 5000);
    }

    /** Internal path only — blocks open redirects (https:, //host, javascript:, etc.). */
    function safeInternalNext(raw) {
      if (!raw || typeof raw !== "string") return null;
      const n = raw.trim();
      if (!n.startsWith("/")) return null;
      if (n.startsWith("//")) return null;
      if (n.includes("\\")) return null;
      if (n.includes("://")) return null;
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(n)) return null;
      return n;
    }

    function postLoginDestination() {
      const params = new URLSearchParams(window.location.search);
      const next = safeInternalNext(params.get("next"));
      if (next) return next;
      if (localStorage.getItem("cliente_selecionado")) return "/";
      return "/clientes";
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      loginBtn.disabled = true;
      loading.hidden = false;
      loginText.textContent = "Entrando…";
      try {
        const formData = new FormData();
        formData.append("username", username);
        formData.append("password", password);
        const response = await fetch("/api/auth/login", { method: "POST", body: formData });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem("access_token", data.access_token);
          localStorage.setItem("user", JSON.stringify(data.user));
          showAlert("Login realizado com sucesso!", "success");
          setTimeout(function () {
            window.location.href = postLoginDestination();
          }, 800);
        } else {
          showAlert(data.detail || "Erro ao fazer login");
        }
      } catch (err) {
        showAlert("Erro ao conectar com o servidor");
      } finally {
        loginBtn.disabled = false;
        loading.hidden = true;
        loginText.textContent = "Entrar";
      }
    });

    document.getElementById("togglePassword").addEventListener("click", function () {
      const input = document.getElementById("password");
      const show = input.getAttribute("type") === "password";
      input.setAttribute("type", show ? "text" : "password");
      this.textContent = show ? "Ocultar" : "Mostrar";
      this.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha");
    });

    if (localStorage.getItem("access_token")) {
      window.location.href = postLoginDestination();
    }
  </script>
</body>
</html>
