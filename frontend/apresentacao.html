<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação - BioMed Platform</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/main.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Sistema de Cores por Cliente -->
    <script src="/static/js/cores-cliente.js"></script>
    
    <style>
        /* RC-23: deck chrome rebuilt — experience layer owns the look under platform shell */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body[data-bm-shell="legacy"] {
            font-family: "BM Sans", "Segoe UI", sans-serif;
            background: transparent;
            color: #132033;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .apresentacao-container {
            width: 100%;
            min-height: calc(100vh - 112px);
            height: calc(100vh - 112px);
            display: flex;
            flex-direction: column;
            background: #0f2a3d;
            border-radius: 0;
            overflow: hidden;
        }
        .apresentacao-header {
            background: linear-gradient(120deg, #12324a 0%, #1a4566 55%, #2a6b5a 100%);
            color: white;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .apresentacao-header h1 {
            font-family: "BM Display", Georgia, serif;
            font-size: 1.2rem;
            font-weight: 650;
            letter-spacing: -0.02em;
        }
        .apresentacao-header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; }
        .slide-indicator { font-size: 14px; opacity: 0.9; }
        .btn-export, .btn-fullscreen {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-export:hover, .btn-fullscreen:hover { background: rgba(255, 255, 255, 0.2); }
        .apresentacao-content {
            flex: 1;
            overflow: auto;
            padding: 1.25rem;
            background:
              radial-gradient(900px 420px at 10% 0%, rgba(255,255,255,0.08), transparent 55%),
              linear-gradient(180deg, #12324a 0%, #0f2433 100%);
        }
        .slide-content { max-width: 1180px; margin: 0 auto; color: #fff; }
        .apresentacao-controls {
            display: flex; justify-content: center; gap: 0.75rem;
            padding: 0.85rem 1.25rem; flex-wrap: wrap;
            background: rgba(15, 36, 51, 0.96);
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .btn-nav {
            border: 0; border-radius: 12px; padding: 0.7rem 1.1rem;
            font-weight: 600; cursor: pointer; color: #fff; min-width: 120px;
        }
        .btn-nav.btn-prev { background: rgba(255,255,255,0.12); }
        .btn-nav.btn-next { background: #2a6b5a; }
        .btn-nav.btn-exit { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); }
        .loading, .error-state { color: rgba(255,255,255,0.85); text-align: center; padding: 3rem 1rem; }
        .kpi-card {
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid rgba(255,255,255,0.14) !important;
            border-radius: 16px !important;
            color: #fff !important;
            box-shadow: none !important;
        }
        .export-menu {
            display: none; position: absolute; top: calc(100% + 8px); right: 0;
            background: #fff; color: #132033; border-radius: 12px;
            box-shadow: 0 12px 32px rgba(19,32,51,0.18); min-width: 240px; z-index: 200; overflow: hidden;
        }
        .export-menu-item { display: flex; gap: 10px; padding: 12px 14px; cursor: pointer; }
        .export-menu-item:hover { background: #f2f5f8; }
        .export-menu-item .label { font-weight: 600; }
        .export-menu-item .desc { font-size: 12px; color: #5a6474; }
        @media (max-width: 900px) {
            .apresentacao-container { height: auto; min-height: 70vh; }
            .apresentacao-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
        }
        @media print {
            .apresentacao-header, .apresentacao-controls { display: none !important; }
            body { overflow: visible !important; background: white !important; }
            .apresentacao-container { background: white !important; height: auto !important; width: 100% !important; display: block !important; }
            .slide-content { page-break-after: always; color: #000 !important; }
        }
    </style>
  <link rel="stylesheet" href="/static/css/biomed-platform.css?v=rc24" data-bm-plat="1" />
  <link rel="stylesheet" href="/static/css/biomed-experience.css?v=rc24" data-bm-exp="1" />
  <link rel="stylesheet" href="/static/css/biomed-polish.css?v=rc24" data-bm-polish="1" />
</head>
<body data-bm-shell="legacy">
    <div class="apresentacao-container">
        <div class="apresentacao-header">
            <h1>
                <i class="fas fa-chart-line"></i>
                Apresentações · BioMed Platform
            </h1>
            <div class="apresentacao-header-right" style="position: relative;">
                <div class="slide-indicator" aria-live="polite">
                    <span id="slideAtual">—</span> / <span id="totalSlides">—</span>
                </div>
                <button class="btn-export" onclick="toggleExportMenu()" title="Exportar Apresentação">
                    <i class="fas fa-download"></i>
                    <span>Exportar</span>
                </button>
                <div class="export-menu" id="exportMenu">
                    <!-- Opção PDF REMOVIDA -->
                    <div class="export-menu-item pptx" onclick="exportarPowerPoint()">
                        <i class="fas fa-file-powerpoint"></i>
                        <div>
                            <div class="label">Exportar PowerPoint</div>
                            <div class="desc">Apresentação em PPTX</div>
                        </div>
                    </div>
                </div>
                <!-- Botão de impressão REMOVIDO -->
                <button class="btn-fullscreen" onclick="toggleFullscreen()" id="btnFullscreen" title="Tela Cheia (F11)">
                    <i class="fas fa-expand" id="fullscreenIcon"></i>
                    <span>Tela Cheia</span>
                </button>
            </div>
        </div>
        
        <div class="apresentacao-content">
            <div id="slideContent" class="slide-content">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Carregando apresentação...</p>
                </div>
            </div>
        </div>
        
        <div class="apresentacao-controls">
            <button class="btn-nav btn-prev" onclick="slideAnterior()" id="btnPrev">
                <i class="fas fa-chevron-left"></i>
                Anterior
            </button>
            <button class="btn-nav btn-exit" onclick="sairApresentacao()">
                <i class="fas fa-times"></i>
                Sair
            </button>
            <button class="btn-nav btn-next" onclick="proximoSlide()" id="btnNext">
                Próximo
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
    
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/apresentacao.js"></script>
    <script>
        // Força recarregamento quando a página é aberta/focada
        window.addEventListener('focus', () => {
            console.log('Página focada, verificando cliente...');
            setTimeout(() => {
                if (typeof carregarApresentacao === 'function') {
                    carregarApresentacao();
                }
            }, 500);
        });
        
        // Recarrega quando a página é carregada
        document.addEventListener('DOMContentLoaded', () => {
            // Aguarda auth.js carregar
            setTimeout(() => {
                if (typeof carregarApresentacao === 'function') {
                    carregarApresentacao();
                }
            }, 1000);
        });
    </script>
  <script src="/static/js/biomed-platform-shell.js?v=rc24"></script>
</body>
</html>
